version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
        - printf "MONGODB_URI=%s\n" "$MONGODB_URI" >> .env.production
        - printf "MONGODB_DB=%s\n" "$MONGODB_DB" >> .env.production
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
